<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEX MÉXICO</title>
<style>
body{font-family:Arial,sans-serif;font-size:20px;margin:0;background:#f4f6f8;color:#1a1a1a;}
header{background:#14532d;color:#fff;padding:24px;text-align:center;}
header h1{margin:0;font-size:34px;}
header p{margin:8px 0 0;font-size:20px;}
main{padding:20px;max-width:700px;margin:auto;}
label{display:block;font-size:24px;font-weight:bold;margin-bottom:10px;}
input{width:100%;box-sizing:border-box;font-size:22px;padding:16px;border:2px solid #14532d;border-radius:10px;}
button{width:100%;margin-top:12px;font-size:24px;padding:16px;background:#14532d;color:#fff;border:none;border-radius:10px;}
select{width:100%;box-sizing:border-box;font-size:22px;padding:16px;border:2px solid #14532d;border-radius:10px;background:#fff;margin-bottom:16px;}
.sub{margin:18px 0 0;font-size:18px;color:#555;}
.sugerencia{width:100%;text-align:left;font-size:22px;padding:14px 16px;margin-top:6px;background:#fff;color:#1a1a1a;border:1px solid #ccc;border-radius:8px;}
.chip{width:auto;display:inline-block;font-size:18px;padding:10px 14px;margin:8px 8px 0 0;background:#e3efe7;color:#14532d;border:1px solid #14532d;border-radius:20px;}
.borrar{width:auto;display:block;font-size:16px;padding:8px 12px;margin-top:12px;background:none;color:#555;border:1px solid #999;border-radius:8px;}
.tarjeta{background:#fff;border:1px solid #ccc;border-radius:10px;padding:16px;margin-top:16px;}
.tarjeta h2{margin:0 0 8px;font-size:24px;color:#14532d;}
.tema{background:#fff;border:1px solid #ccc;border-left:8px solid #14532d;border-radius:10px;padding:16px;margin-top:16px;}
.tema h2{margin:0 0 8px;font-size:28px;color:#14532d;}
.tema h3{margin:16px 0 4px;font-size:20px;color:#14532d;}
.tema p{margin:0;}
.tema .nota{background:#fff8e1;padding:10px;border-radius:8px;margin-top:16px;font-size:18px;}
.tarjeta a,.tema a{display:block;color:#14532d;font-weight:bold;margin-top:12px;}
.aviso{font-size:16px;color:#555;margin-top:30px;}
</style>
</head>
<body>
<header>
<h1>LEX MÉXICO 🇲🇽</h1>
<p>Conoce tus derechos y las leyes de México</p>
</header>
<main>
<label for="estado">¿En qué estado estás?</label>
<select id="estado" onchange="cambiarEstado()"></select>
<p id="notaEstado" class="sub" style="margin:0 0 16px;"></p>
<label for="buscar">¿Qué quieres saber?</label>
<input id="buscar" type="text" placeholder="Ejemplo: despido, robo, garantía" oninput="sugerir()" autocomplete="off">
<div id="sugerencias"></div>
<button onclick="buscar()">Buscar</button>
<div id="historial"></div>
<div id="situaciones"></div>
<div id="resultados"></div>
<p class="aviso">LEX MÉXICO ofrece información y orientación. No sustituye a un abogado.</p>
</main>
<script src="leyes.js"></script>
<script src="temas.js"></script>
<script src="estados.js"></script>
<script>
function limpiar(t){return t.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"");}

const vocabulario=[];
function agregarPalabras(texto){
texto.split(/\s+/).forEach(function(w){
const t=w.toLowerCase().replace(/[^a-záéíóúüñ]/g,"");
const clave=limpiar(t);
if(clave.length>=4&&!vocabulario.some(function(v){return v.clave===clave;})){
vocabulario.push({clave:clave,texto:t});
}
});
}

let LEYES=leyes,TEMAS=temas,ESTADO=null;

function buscarUrl(s,q){return "https://www.google.com/search?q="+encodeURIComponent(q+" "+s.n+" legislación vigente");}
function llenar(txt,s){return txt.replace(/\{de\}/g,s.de).replace(/\{en\}/g,s.en).replace(/\{n\}/g,s.n);}

function leyesDeEstado(s){
const base=[
["Constitución política local","constitucion estado derechos gobierno","Es la ley máxima del estado. Organiza el gobierno estatal y reconoce derechos en el ámbito local."],
["Código Penal","codigo penal delito robo fraude lesiones homicidio amenazas despojo extorsion abuso","Define los delitos del fuero común y sus penas en el estado."],
["Código Civil","codigo civil contrato renta propiedad herencia familia bienes divorcio","Regula contratos, bienes, familia y herencia en el estado."],
["Ley o reglamento de tránsito y vialidad","transito vialidad multas infracciones licencia conductor placas vehiculo reglamento circulacion corralon grua deposito semaforo velocidad","Regula la circulación, las infracciones, las licencias y los depósitos de vehículos en el estado."],
["Ley de movilidad y transporte","movilidad transito vialidad transporte publico taxi colectivo concesiones pasajeros","Regula la movilidad y el transporte público de pasajeros en el estado."],
["Ley de caminos y carreteras","caminos carreteras puentes infraestructura vial","Regula los caminos y carreteras de competencia estatal."],
["Ley orgánica municipal","municipio ayuntamiento presidente municipal cabildo autoridad municipal regidor","Regula cómo se organiza y gobierna cada municipio del estado."],
["Ley de responsabilidades administrativas","corrupcion servidor publico funcionario responsabilidades sancion administrativa","Regula las faltas administrativas de las personas servidoras públicas del estado."]
];
return base.map(function(b){
return {nombre:b[0]+" "+s.de,resumen:b[2]+" El nombre exacto puede variar; consulta la versión vigente.",palabras:b[1]+" "+limpiar(s.n),web:buscarUrl(s,b[0]),buscar:true};
});
}

function adaptarTema(t,s){
const o={};
Object.keys(t).forEach(function(k){o[k]=t[k];});
const g=GENERICO[t.nombre];
if(g){Object.keys(g).forEach(function(k){o[k]=llenar(g[k],s);});}
o.palabras=o.palabras.replace(/oaxaca/gi,limpiar(s.n));
if(o.web&&/oaxaca/i.test(o.web)){o.web=buscarUrl(s,"Congreso legislación estatal");o.buscar=true;}
if(o.pdf&&/oaxaca/i.test(o.pdf)){delete o.pdf;}
return o;
}

function aplicarEstado(s){
ESTADO=s;
if(s.n==="Oaxaca"){
LEYES=leyes;TEMAS=temas;
document.getElementById("notaEstado").textContent="";
}else{
LEYES=leyes.filter(function(l){return !/Oaxaca/.test(l.nombre);}).concat(leyesDeEstado(s));
TEMAS=temas.map(function(t){return adaptarTema(t,s);});
document.getElementById("notaEstado").textContent="Para "+s.n+" se muestran las leyes federales y la información general. Los enlaces de leyes estatales son búsquedas en línea; revisa siempre el texto oficial vigente.";
}
vocabulario.length=0;
LEYES.forEach(function(l){agregarPalabras(l.nombre+" "+l.palabras);});
TEMAS.forEach(function(t){agregarPalabras(t.nombre+" "+t.palabras);});
try{localStorage.setItem("estado",s.n);}catch(e){}
}
function cambiarEstado(){
const n=document.getElementById("estado").value;
const s=estados.filter(function(e){return e.n===n;})[0];
if(!s){return;}
aplicarEstado(s);
document.getElementById("sugerencias").innerHTML="";
if(document.getElementById("buscar").value.trim()){buscar();}else{document.getElementById("resultados").innerHTML="";mostrarSituaciones();}
}
function iniciarEstados(){
const sel=document.getElementById("estado");
estados.forEach(function(e){
const o=document.createElement("option");
o.value=e.n;o.textContent=e.n;sel.appendChild(o);
});
let guardado="Oaxaca";
try{guardado=localStorage.getItem("estado")||"Oaxaca";}catch(e){}
if(!estados.some(function(e){return e.n===guardado;})){guardado="Oaxaca";}
sel.value=guardado;
aplicarEstado(estados.filter(function(e){return e.n===guardado;})[0]);
}

function distancia(a,b){
const m=a.length,n=b.length;
const d=[];
for(let i=0;i<=m;i++){d[i]=[i];}
for(let j=1;j<=n;j++){d[0][j]=j;}
for(let i=1;i<=m;i++){
for(let j=1;j<=n;j++){
const c=a[i-1]===b[j-1]?0:1;
d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+c);
}
}
return d[m][n];
}
function puntaje(a,b){
return Math.min(distancia(a,b),distancia(a,b.slice(0,a.length)));
}

function leerHistorial(){
try{return JSON.parse(localStorage.getItem("historial")||"[]");}catch(e){return [];}
}
function guardarHistorial(texto){
let h=leerHistorial().filter(function(x){return limpiar(x)!==limpiar(texto);});
h.unshift(texto);
h=h.slice(0,8);
try{localStorage.setItem("historial",JSON.stringify(h));}catch(e){}
mostrarHistorial();
}
function mostrarHistorial(){
const h=leerHistorial();
const c=document.getElementById("historial");
c.innerHTML="";
if(!h.length){return;}
const t=document.createElement("p");
t.className="sub";
t.textContent="Búsquedas recientes";
c.appendChild(t);
h.forEach(function(texto){
const b=document.createElement("button");
b.className="chip";
b.textContent=texto;
b.onclick=function(){document.getElementById("buscar").value=texto;buscar();};
c.appendChild(b);
});
const x=document.createElement("button");
x.className="borrar";
x.textContent="Borrar historial";
x.onclick=function(){try{localStorage.removeItem("historial");}catch(e){}mostrarHistorial();};
c.appendChild(x);
}

function sugerir(){
const caja=document.getElementById("sugerencias");
caja.innerHTML="";
const valor=document.getElementById("buscar").value;
const t=limpiar(valor.trim());
if(!valor.trim()){mostrarSituaciones();document.getElementById("resultados").innerHTML="";return;}
if(t.length<2){return;}
const partes=valor.trim().split(/\s+/);
const ultima=limpiar(partes[partes.length-1]);
const inicio=partes.slice(0,-1).join(" ");
const lista=[];
leerHistorial().forEach(function(h){
if(limpiar(h).indexOf(t)===0&&limpiar(h)!==t){lista.push({texto:h,etiqueta:"🕘 "+h});}
});
const margen=ultima.length>=6?2:1;
const cand=[];
vocabulario.forEach(function(v){
const p=ultima.length>=3?puntaje(ultima,v.clave):(v.clave.indexOf(ultima)===0?0:99);
if(p<=margen&&v.clave!==ultima){cand.push({v:v,p:p});}
});
cand.sort(function(a,b){return a.p-b.p||a.v.clave.length-b.v.clave.length;});
cand.slice(0,5).forEach(function(c){
const completo=(inicio?inicio+" ":"")+c.v.texto;
lista.push({texto:completo,etiqueta:"🔍 "+completo});
});
lista.slice(0,6).forEach(function(s){
const b=document.createElement("button");
b.className="sugerencia";
b.textContent=s.etiqueta;
b.onclick=function(){document.getElementById("buscar").value=s.texto;buscar();};
caja.appendChild(b);
});
}

function corregir(q){
let cambio=false;
const salida=q.split(/\s+/).map(function(tok){
if(vocabulario.some(function(v){return v.clave.indexOf(tok)!==-1;})){return tok;}
const margen=tok.length>=6?2:1;
let mejor=null,mp=99;
vocabulario.forEach(function(v){
const p=distancia(tok,v.clave);
if(p<mp){mp=p;mejor=v;}
});
if(tok.length>=4&&mejor&&mp<=margen){cambio=true;return mejor.texto;}
return tok;
});
return cambio?salida.join(" "):null;
}

const vacias=["de","del","la","las","el","los","en","y","o","para","por","con","un","una","ley","leyes","reglamento","reglamentos","codigo","codigos","me","mi","mis","se","que","lo","al","a","es","hay","puedo","como","quiero","necesito"];

const SITUACIONES=[
["Me despidieron","despido"],
["Me multaron","multa"],
["Se llevaron mi carro al corralón","corralon"],
["Tuve un choque","accidente"],
["Me robaron","robo"],
["Me estafaron","fraude"],
["Me amenazan","amenazas"],
["Problema con mi renta","renta"],
["Compré algo defectuoso","garantia"],
["Quiero divorciarme","divorcio"]
];

const SINONIMOS=[
["me corrieron del trabajo","despido"],["me echaron del trabajo","despido"],["me despidieron","despido"],["me corrieron","despido"],["me corrio","despido"],["me liquidaron","finiquito"],
["me corrieron de mi casa","despojo"],["invadieron mi terreno","despojo"],["me quieren quitar mi terreno","despojo"],["me quitaron mi terreno","despojo"],
["mordida","corrupcion soborno"],["me pidieron dinero","corrupcion soborno"],["me pidieron una mordida","corrupcion soborno"],
["me cobraron de mas","cobro abusivo"],["me cobraron mal","cobro abusivo"],["no me quieren devolver","devolucion"],["producto defectuoso","garantia"],
["me estafaron","fraude"],["me timaron","fraude"],["me engañaron","fraude"],
["me asaltaron","robo"],["me robaron","robo"],["me asalto","robo"],
["se llevaron mi carro","corralon grua"],["se llevaron mi moto","corralon grua"],["se llevo mi carro","corralon grua"],["se llevo la grua","corralon grua"],["me quitaron las placas","placas"],
["me pusieron una multa","multa"],["me levantaron una multa","multa"],["me infraccionaron","infraccion"],["me multaron","multa"],["me pararon","infraccion"],
["me chocaron","choque"],["tuve un choque","accidente"],["me atropellaron","atropello"],
["me pegaron","lesiones"],["me golpearon","lesiones"],["me amenazaron","amenazas"],["me amenazan","amenazas"],
["mi esposo me pega","violencia familiar"],["mi pareja me pega","violencia familiar"],["violencia domestica","violencia familiar"],["me acosan","acoso"],
["me detuvieron","detencion"],["me arrestaron","detencion"],["me llevaron detenido","detencion"],
["me quiero divorciar","divorcio"],["quiero divorciarme","divorcio"],["no me paga la pension","pension alimenticia"],["pension de mis hijos","pension alimenticia"],
["me suben la renta","renta"],["me quieren desalojar","renta"],
["me pidieron mis datos","datos personales"]
].sort(function(a,b){return b[0].length-a[0].length;});

function sinonimos(q){
let r=q;
SINONIMOS.forEach(function(p){
const f=limpiar(p[0]);
if(r.indexOf(f)!==-1){r=r.split(f).join(p[1]);}
});
return r;
}

function mostrarSituaciones(){
const c=document.getElementById("situaciones");
c.innerHTML="";
const t=document.createElement("p");
t.className="sub";
t.textContent="Situaciones comunes";
c.appendChild(t);
SITUACIONES.forEach(function(s){
const b=document.createElement("button");
b.className="chip";
b.textContent=s[0];
b.onclick=function(){document.getElementById("buscar").value=s[1];buscar();};
c.appendChild(b);
});
}
function filtrar(lista,q,campos){
let tokens=q.split(/\s+/).filter(function(t){return t;});
const utiles=tokens.filter(function(t){return vacias.indexOf(t)===-1;});
if(utiles.length){tokens=utiles;}
return lista.filter(function(x){
const base=limpiar(campos(x));
return tokens.every(function(t){return base.indexOf(t)!==-1;});
});
}
function filtrarAlguno(lista,q,campos){
const tokens=q.split(/\s+/).filter(function(t){return t.length>=4&&vacias.indexOf(t)===-1;});
if(!tokens.length){return [];}
return lista.map(function(x){
const base=limpiar(campos(x));
let n=0;
tokens.forEach(function(t){if(base.indexOf(t)!==-1){n++;}});
return {x:x,n:n};
}).filter(function(o){return o.n>0;}).sort(function(a,b){return b.n-a.n;}).slice(0,5).map(function(o){return o.x;});
}
function leyesQue(q){return filtrar(LEYES,q,function(l){return l.nombre+" "+l.resumen+" "+l.palabras;});}
function temasQue(q){return filtrar(TEMAS,q,function(t){return t.nombre+" "+t.palabras;});}

function pintar(th,lh,aviso){
const cont=document.getElementById("resultados");
cont.innerHTML=aviso;
th.forEach(function(t){
cont.innerHTML+='<div class="tema"><h2>'+t.nombre+'</h2><h3>Qué es</h3><p>'+t.queEs+'</p><h3>Qué conlleva</h3><p>'+t.queConlleva+'</p><h3>Dónde lo dice la ley</h3><p>'+t.ley+'</p><p class="nota"><b>Importante:</b> '+t.importante+'</p><a href="'+t.web+'" target="_blank" rel="noopener">'+(t.buscar?'Buscar texto oficial en línea':'Leer en línea (sitio oficial)')+'</a>'+(t.pdf?'<a href="'+t.pdf+'" target="_blank" rel="noopener">Descargar PDF oficial</a>':'')+'</div>';
});
if(th.length&&lh.length){cont.innerHTML+='<p class="sub">Leyes relacionadas</p>';}
lh.forEach(function(l){
cont.innerHTML+='<div class="tarjeta"><h2>'+l.nombre+'</h2><p>'+l.resumen+'</p><a href="'+l.web+'" target="_blank" rel="noopener">'+(l.buscar?'Buscar texto oficial en línea':'Leer en línea (sitio oficial)')+'</a>'+(l.pdf?'<a href="'+l.pdf+'" target="_blank" rel="noopener">Descargar PDF oficial</a>':'')+'</div>';
});
}

function buscar(){
const texto=document.getElementById("buscar").value.trim();
const q0=limpiar(texto);
const q=sinonimos(q0);
const cont=document.getElementById("resultados");
document.getElementById("sugerencias").innerHTML="";
cont.innerHTML="";
if(!q){cont.innerHTML="<p>Escribe una palabra para buscar.</p>";return;}
document.getElementById("situaciones").innerHTML="";
guardarHistorial(texto);
let th=temasQue(q);
let lh=leyesQue(q);
let aviso="";
if(!th.length&&!lh.length&&q!==q0){th=temasQue(q0);lh=leyesQue(q0);}
if(!th.length&&!lh.length){
const c=corregir(q);
if(c){
th=temasQue(limpiar(c));
lh=leyesQue(limpiar(c));
if(th.length||lh.length){aviso='<p class="sub">Mostrando resultados para: <b>'+c+'</b></p>';}
}
}
if(!th.length&&!lh.length){
th=filtrarAlguno(TEMAS,q,function(t){return t.nombre+" "+t.palabras;});
lh=filtrarAlguno(LEYES,q,function(l){return l.nombre+" "+l.resumen+" "+l.palabras;});
if(th.length||lh.length){aviso='<p class="sub">No hay una coincidencia exacta. Estos son resultados parecidos.</p>';}
}
if(!th.length&&!lh.length){cont.innerHTML="<p>No encontré resultados. Prueba con otra palabra.</p>";return;}
pintar(th,lh,aviso);
}
document.getElementById("buscar").addEventListener("keydown",function(e){if(e.key==="Enter"){buscar();}});
iniciarEstados();
mostrarHistorial();
mostrarSituaciones();
</script>
</body>
</html>
